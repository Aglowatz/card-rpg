    .bd-dialogue-root {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      justify-content: center;
      padding: 0 20px 28px;
      box-sizing: border-box;
      font-family: 'Baloo 2', 'Comic Sans MS', 'Trebuchet MS', 'Segoe UI Rounded',
        system-ui, sans-serif;
      z-index: 9999;
      pointer-events: none;
    }

    .bd-dialogue-panel {
      pointer-events: auto;
      display: flex;
      align-items: flex-start;
      gap: 18px;
      width: min(720px, 100%);
      background: ${n};
      border: 4px solid ${e};
      border-radius: 26px;
      padding: 18px 22px;
      box-shadow: 0 10px 0 rgba(0,0,0,0.18), 0 18px 34px rgba(20,10,40,0.35);
      color: ${t};
      opacity: 0;
      transform: translateY(28px) scale(0.94);
      transition: opacity 0.22s ease, transform 0.28s cubic-bezier(0.34, 1.56, 0.64, 1);
      cursor: pointer;
      user-select: none;
      position: relative;
    }

    .bd-dialogue-panel.bd-open {
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .bd-dialogue-portrait-wrap {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bd-dialogue-portrait-wrap svg {
      display: block;
      filter: drop-shadow(0 4px 0 rgba(0,0,0,0.2));
    }

    .bd-dialogue-body {
      flex: 1 1 auto;
      min-width: 0;
      padding-top: 2px;
    }

    .bd-dialogue-name {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 0.02em;
      color: ${e};
      margin: 0 0 6px;
      text-shadow: 0 2px 0 rgba(0,0,0,0.25);
    }

    .bd-dialogue-text {
      font-size: 19px;
      line-height: 1.42;
      margin: 0;
      min-height: 3.1em;
      white-space: pre-wrap;
      text-shadow: 0 1px 0 rgba(0,0,0,0.2);
    }

    .bd-dialogue-text .bd-cursor {
      display: inline-block;
      width: 0.5em;
      opacity: 0.85;
      animation: bd-caret-blink 0.85s steps(1) infinite;
    }

    @keyframes bd-caret-blink {
      0%, 45% { opacity: 0.85; }
      50%, 100% { opacity: 0; }
    }

    .bd-dialogue-continue {
      position: absolute;
      right: 22px;
      bottom: 12px;
      width: 16px;
      height: 16px;
      opacity: 0;
      transition: opacity 0.15s ease;
      pointer-events: none;
    }

    .bd-dialogue-continue.bd-visible {
      opacity: 1;
      animation: bd-bounce 1s ease-in-out infinite;
    }

    .bd-dialogue-continue svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    @keyframes bd-bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @media (max-width: 560px) {
      .bd-dialogue-panel { gap: 12px; padding: 14px 16px; }
